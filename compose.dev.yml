# Local and CI databases only. Ports bind to 127.0.0.1 (SEC-1). Dev passwords are not secrets.
name: orbit-dev
services:
  postgres:
    # The WSL2 engine stops when no WSL session is open, which exits these containers with 0.
    # The instance stack sets the same policy, so the dev stack comes back with the engine.
    restart: unless-stopped
    # Digest-pinned 2026-11-09; see VERSIONS.md for the record and the upgrade steps.
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orbit_test
      ORBIT_DB_PASSWORD: orbit_dev
      PAPERCLIP_DB_PASSWORD: paperclip_dev
    ports: ["127.0.0.1:${ORBIT_DB_HOST_PORT:-5432}:5432"]
    volumes:
      - ./template/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the temporary server used during init listens on the socket only,
      # so this passes only after the init script has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d orbit_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    restart: unless-stopped
    # Digest-pinned 2026-11-09; see VERSIONS.md.
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
