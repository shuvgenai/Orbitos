<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ORBIT-OS preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>/* ORBIT-OS design tokens. One place to rebrand. */
:root{
  --brand:#6316F9;--accent:#E94BB5;
  --canvas:#F3F2F8;--canvas-alt:#EBEAF2;--surface:#FFFFFF;--ink:#1A1A24;--muted:#6B6B7B;--line:#E2E0EB;
  --ok:#15803d;--ok-bg:#dcfce7;--warn:#a16207;--warn-bg:#fef3c7;--err:#dc2626;--err-bg:#fee2e2;
  --brand-ink:color-mix(in srgb,var(--brand) 82%,#000);
  --brand-50:color-mix(in srgb,var(--brand) 7%,var(--surface));
  --brand-100:color-mix(in srgb,var(--brand) 15%,var(--surface));
  --grad:linear-gradient(135deg,var(--brand),var(--accent));
  --r-lg:18px;--r-md:12px;--r-sm:8px;
  --shadow:0 1px 2px rgba(26,20,60,.05),0 10px 30px -12px rgba(26,20,60,.12);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --side:232px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--canvas:#100F18;--canvas-alt:#181724;--surface:#1B1A27;--ink:#EDECF6;--muted:#A09FB4;--line:#2D2B3D;--ok:#4ade80;--ok-bg:#12321f;--warn:#fbbf24;--warn-bg:#382a0d;--err:#f87171;--err-bg:#3a1616;--brand-ink:color-mix(in srgb,var(--brand) 55%,#fff);--shadow:0 1px 0 rgba(255,255,255,.02)}
}
:root[data-theme="dark"]{--canvas:#100F18;--canvas-alt:#181724;--surface:#1B1A27;--ink:#EDECF6;--muted:#A09FB4;--line:#2D2B3D;--ok:#4ade80;--ok-bg:#12321f;--warn:#fbbf24;--warn-bg:#382a0d;--err:#f87171;--err-bg:#3a1616;--brand-ink:color-mix(in srgb,var(--brand) 55%,#fff);--shadow:0 1px 0 rgba(255,255,255,.02)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
small,.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.sp{flex:1}
.stack{display:flex;flex-direction:column;gap:14px}
.app{display:flex;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.side{width:var(--side);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.brand b{display:block;line-height:1.1}.brand small{font-size:12px}
.scope{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;background:var(--canvas)}
.scope b{display:block;font-size:13px;line-height:1.2}.scope small{font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500}
.nav:hover{background:var(--canvas)}
.nav.active{background:var(--brand-100);color:var(--brand-ink)}
.nav .count{margin-left:auto;background:var(--brand);color:#fff;border-radius:99px;font-size:11px;font-weight:600;padding:0 7px;min-width:18px;text-align:center}
.nav-label{font-size:11px;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--line)}
.me b{display:block;font-size:13px;line-height:1.2}.me small{font-size:12px}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.top h1{font-size:17px;letter-spacing:-.01em}
.main{padding:24px;max-width:1120px;width:100%;margin:0 auto;flex:1}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h2{font-size:24px;letter-spacing:-.02em}
.page-h p{color:var(--muted);margin-top:2px;max-width:62ch}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px;gap:10px}
.sec-h h3{font-size:16px}
.roles{display:inline-flex;background:var(--canvas-alt);border-radius:99px;padding:3px;gap:2px}
.roles a{border-radius:99px;padding:5px 13px;font-weight:500;font-size:13px;color:var(--muted)}
.roles a[aria-current=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dev{margin:0 24px 24px;border:1px dashed var(--line);border-radius:var(--r-md);background:var(--canvas-alt);padding:8px 14px}
.dev summary{cursor:pointer;font-weight:600;font-size:13px}
.dev .row{margin-top:10px}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .side .brand,.side .scope,.side .me,.side .nav-label{display:none}
  .nav{white-space:nowrap}
  .top{padding:12px 16px}.main{padding:16px}.dev{margin:0 16px 16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:500;min-height:38px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-ink)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}.btn.ghost{background:transparent}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ic{flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.card.flush{overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{padding:14px 16px}.kpi small{display:block;font-size:12px}.kpi b{font-size:26px;letter-spacing:-.02em;line-height:1.2}
.kpi.hero{background:var(--brand-50);border-color:var(--brand-100)}.kpi.hero b{color:var(--brand-ink)}
.kpi .of{font-size:15px;font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--canvas-alt);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.err{background:var(--err-bg);color:var(--err)}.pill.brand{background:var(--brand-100);color:var(--brand-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pill.ok .dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-100);color:var(--brand-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.av.lg{width:40px;height:40px;font-size:14px}
.mono{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.mono.sm{width:28px;height:28px;font-size:11px;border-radius:8px}
.mono.tile{background:var(--tile,#56657A)}
/* forms */
.field{margin-bottom:12px}.field>label,.lbl{display:block;font-weight:600;margin-bottom:4px;font-size:13px}
.help{font-size:12px;color:var(--muted);margin-top:4px}.err-t{font-size:12px;color:var(--err);margin-top:4px}
input[type=text],input[type=email],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px;min-height:38px}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--brand-100);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.chip[disabled]{opacity:.5;cursor:not-allowed}
/* tables */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:middle}
.tbl th{border-top:0;font-weight:500;color:var(--muted);background:var(--canvas);white-space:nowrap}
.tbl th button{border:0;background:none;font-weight:500;color:inherit;padding:0}
.tbl td select,.tbl td input{min-width:120px}
.tbl tr.row-b{cursor:pointer}.tbl tr.row-b:hover td{background:var(--brand-50)}
.warn-t{color:var(--warn);font-weight:600}.ok-t{color:var(--ok);font-weight:600}
/* lists, notes */
.list>.item{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line)}
.list>.item:first-child{border-top:0}
.note{padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-bg);color:var(--warn);font-size:13px}
.note.ok{background:var(--ok-bg);color:var(--ok)}.note.err{background:var(--err-bg);color:var(--err)}.note.info{background:var(--brand-50);color:var(--brand-ink)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:4px}
.guard{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--canvas)}
.guard h4{font-size:13px;margin-bottom:6px}
.gl{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.gl li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;font-size:13px}.gl li span{flex:1}
.addrow{display:flex;gap:8px;margin-top:8px}
/* stepper */
.stepper{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:130px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);text-align:left}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--canvas-alt);font-weight:600;font-size:12px;flex:none}
.step b{display:block;font-size:13px;line-height:1.2}.step small{font-size:11px}
.step.on{border-color:var(--brand);background:var(--brand-50)}.step.on .n{background:var(--brand);color:#fff}
.step.done .n{background:var(--ok-bg);color:var(--ok)}
.step[disabled]{opacity:.55;cursor:not-allowed}
.wfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:18px}
.todo{margin:0;padding-left:18px;font-size:13px}.todo li{margin:2px 0}
/* org tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:18px;padding-left:18px;border-left:2px solid var(--line)}
.tree li{position:relative;padding:5px 0}
.tree ul>li::before{content:"";position:absolute;left:-18px;top:26px;width:18px;border-top:2px solid var(--line)}
.tnode{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;min-width:220px;max-width:100%}
.tnode.board{background:var(--brand-50);border-color:var(--brand-100)}
.tnode.dim{opacity:.6;border-style:dashed}
.tnode b{display:block;font-size:13px;line-height:1.2}.tnode small{font-size:12px}
button.tnode{text-align:left}button.tnode:hover{border-color:var(--brand)}
/* connections */
.conn{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.conn .body{flex:1;min-width:0}
.conn .who{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
/* agent card */
.agent{padding:16px;display:flex;flex-direction:column;gap:10px}
.doing{background:var(--canvas);border-radius:var(--r-sm);padding:8px 10px;font-size:13px}.doing small{display:block;font-size:11px}
.meta{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* map */
.pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mapu{display:flex;align-items:center;margin-bottom:22px}
.unode{width:170px;flex:none;padding:14px;text-align:center}.unode .av{margin:0 auto 6px}
.mapsvg{flex:none;width:64px}.mapsvg path{fill:none;stroke-width:2}
.s-running{color:var(--ok)}.s-waiting{color:var(--warn)}.s-idle,.s-draft{color:#8A8AA0}.s-paused,.s-blocked{color:var(--err)}
.mapsvg .idle,.mapsvg .paused,.mapsvg .draft{stroke-dasharray:4 4}
.anodes{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.anode{height:64px;display:flex;align-items:center;gap:10px;padding:0 14px;text-align:left;width:100%;border-left:4px solid currentColor;background:var(--surface)}
.anode .t{flex:1;min-width:0;color:var(--ink)}.anode b{display:block;font-size:14px}
.anode small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){.mapu{flex-direction:column;align-items:stretch}.mapsvg{display:none}.unode{width:100%;margin-bottom:10px}.anodes{padding-left:14px;border-left:2px solid var(--line)}}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--brand-ink);border-bottom-color:var(--brand)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:99px;background:var(--brand);color:#fff;font-size:11px;font-weight:600;margin-left:6px;padding:0 5px}
/* progress */
.bar{height:8px;border-radius:99px;background:var(--canvas-alt);overflow:hidden}.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .3s}
.job li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.job li:first-child{border-top:0}
.job .s{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--canvas-alt);flex:none}
.job .s.done{background:var(--ok-bg);color:var(--ok)}.job .s.run{background:var(--brand-100);color:var(--brand-ink);animation:pulse 1s infinite}.job .s.fail{background:var(--err-bg);color:var(--err)}
/* layer */
.scrim{position:fixed;inset:0;background:rgba(16,14,30,.45);display:flex;justify-content:flex-end;z-index:50}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(580px,100%);height:100%;background:var(--surface);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;animation:slide .18s ease-out}
.modal{width:min(540px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dh{display:flex;align-items:flex-start;gap:10px}.dh h2{font-size:18px}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ver{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.ver:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;z-index:90;font-weight:500;max-width:90vw}
.attn{padding:12px 16px;margin-bottom:16px;background:var(--warn-bg);color:var(--warn);border-radius:var(--r-md)}
.hero-card{padding:22px;background:var(--brand-50);border-color:var(--brand-100)}
.hero-card h2{font-size:20px;letter-spacing:-.01em}

/* Single source of truth, persisted in localStorage. Replace with API calls later (see api.js). */
window.Store = (function(){
  let S = null; const subs = [];
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  function load(){
    try{ const r = localStorage.getItem(CFG.STORE_KEY); if(r) S = JSON.parse(r); }catch(e){}
    if(!S || !S.org) S = Seeds.fresh();
  }
  function save(){ try{ localStorage.setItem(CFG.STORE_KEY, JSON.stringify(S)); }catch(e){} }
  function emit(src){ subs.forEach(f => f(src)); }
  return {
    uid,
    init(){ load(); window.addEventListener('storage', e => { if(e.key === CFG.STORE_KEY){ load(); emit('remote'); } }); },
    get: () => S,
    update(fn, src){ fn(S); save(); emit(src || 'user'); },
    subscribe(f){ subs.push(f); },
    reset(kind){ S = kind === 'demo' ? Seeds.demo() : Seeds.fresh(); save(); emit('user'); },
    audit(who, what){ S.audit.unshift({at:Date.now(), who, what}); S.audit = S.audit.slice(0,40); }
  };
})();

  const kpi = (label, value, of='', hero=false) => `<div class="card kpi ${hero?'hero':''}"><small>${label}</small><b class="num">${value}${of?` <span class="of">${of}</span>`:''}</b></div>`;
  const pageH = (title, sub='', right='') => `<div class="page-h"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`;
  const empty = (title, sub, cta='') => `<div class="card empty"><h3>${title}</h3><p>${sub}</p>${cta?`<div style="margin-top:12px">${cta}</div>`:''}</div>`;
  const sel = (opts, val, attrs='') => `<select ${attrs}>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(l)}</option>`).join('')}</select>`;

    t.className='toast'; t.textContent=m; clearTimeout(tt); tt=setTimeout(()=>{t.className='';t.textContent='';},3000); }

  const layer = () => document.getElementById('layer');
  function open(html, o={}){ const L = layer(); L.innerHTML = `<div class="scrim ${o.center?'center':''}" data-scrim="1">${html}</div>`; L.dataset.open='1';
    const f = L.querySelector('[autofocus],textarea:not([readonly]),input:not([type=checkbox])'); if(f) f.focus(); }
  function close(){ const L = layer(); if(L){ L.innerHTML=''; delete L.dataset.open; } UI.onClose && UI.onClose(); UI.onClose = null; }
  const isOpen = () => !!(layer() && layer().dataset.open);
  function confirm(msg, yes, label='Confirm'){ UI.act('_yes', ()=>{ close(); yes(); });
    open(`<section class="modal" role="alertdialog" aria-modal="true"><h2 style="font-size:17px">${esc(msg)}</h2><div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="_yes">${esc(label)}</button></div></section>`, {center:true}); }

  const acts = {}, ins = {}, chs = {};
  const UI = {esc,money,initials,ago,ic,pill,statusPill,kpi,pageH,empty,sel,toast,open,close,isOpen,confirm,ST,
    act:(n,f)=>{acts[n]=f;}, inp:(n,f)=>{ins[n]=f;}, chg:(n,f)=>{chs[n]=f;}, onClose:null};
  UI.act('close', () => close());
  document.addEventListener('click', e => {
    const sc = e.target.closest('[data-scrim]'); if(sc && e.target === sc){ close(); return; }
    const t = e.target.closest('[data-act]'); if(t && acts[t.dataset.act]) acts[t.dataset.act](t, t.dataset, e);
  });
  document.addEventListener('input', e => { const t = e.target.closest('[data-in]'); if(t && ins[t.dataset.in]) ins[t.dataset.in](t.value, t, t.dataset); });
  document.addEventListener('change', e => { const t = e.target.closest('[data-ch]'); if(t && chs[t.dataset.ch]) chs[t.dataset.ch](t.type==='checkbox'?t.checked:t.value, t, t.dataset); });
  document.addEventListener('keydown', e => {
    if(e.key==='Escape' && isOpen()){ close(); return; }

    if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('tr[data-act]')){ e.preventDefault(); e.target.click(); }
  });
  return UI;
})();

/* Hash router. Per-role index: #/home/arg. All-in-one preview: #/admin/home/arg. */
window.Router = (function(){
  const defs = {}; let cur = null;
  const ROLES = ['user','admin','super'];
  function parse(){
    const parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
    if(!CFG.ROLE && ROLES.includes(parts[0])) cur = parts.shift();
    return {role: CFG.ROLE || cur || 'admin', name: parts[0] || null, arg: parts[1] || null};
  }
  return {
    reg(role, name, def){ (defs[role] = defs[role] || {})[name] = def; },
    defs: r => defs[r] || {},
    parse,
    href(name, arg, role){ const r = role || parse().role; return '#' + (CFG.ROLE ? '' : '/' + r) + '/' + name + (arg ? '/' + arg : ''); },
    go(name, arg, role){ location.hash = this.href(name, arg, role); }
  };
})();

  let ag = null; // draft in the drawer

  function draftFrom(a, jt){
    const s = S(), c = API.coordinator();

    if(jt){ const d = s.departments.find(x => x.name === jt.dept) || s.departments[0]; return {id:null, type:jt.type, name:jt.name, job:jt.job, deptId:d?d.id:null, managerId:jt.type==='coordinator'?null:(c?c.id:null), prompt:jt.prompt, tools:jt.tools.slice(), budget:jt.budget, jobId:jt.id, errs:[]}; }
    return {id:null, type:c?'specialist':'coordinator', name:'', job:'', deptId:s.departments[0]?s.departments[0].id:null, managerId:c?c.id:null, prompt:'', tools:[], budget:15, jobId:null, errs:[]};

  UI.act('ag-tool', (t,d) => { const i = ag.tools.indexOf(d.id); i<0 ? ag.tools.push(d.id) : ag.tools.splice(i,1); t.setAttribute('aria-pressed', i<0); });
  UI.act('agent-save', () => { const errs = API.createAgent(ag); if(errs.length){ ag.errs = errs; agentDrawer(); return; } UI.close(); UI.toast(ag.name.trim() + (ag.id?' updated':' added to your team')); });
  UI.act('agent-del', () => { const e = API.removeAgent(ag.id); if(e){ ag.errs = [e]; agentDrawer(); return; } UI.close(); UI.toast('Agent removed'); });

  /* ===================== 3. ASSIGN ===================== */
  OA.assignView = function(){
    const s = S(); const owners = [['','Unassigned']].concat(s.people.map(p => [p.id, p.name || 'New person']));
    if(!s.agents.length) return UI.empty('No agents yet','Create your agents in the previous step, then assign each one to a person.');
    const rows = s.agents.map(a => { const d = API.dept(a.deptId); return `<tr><td><div class="row"><span class="mono sm" aria-hidden="true">${esc(initials(a.name))}</span><div><b>${esc(a.name)}</b> ${a.type==='coordinator'?pill('Coordinator','brand'):''}<small style="display:block">${esc(a.job)}</small></div></div></td>
      <td>${esc(d?d.name:'None')}</td><td>${sel(owners, a.ownerId, `data-ch="assign" data-id="${a.id}" aria-label="Owner of ${esc(a.name)}"`)}</td></tr>`; }).join('');
    const per = s.people.map(p => { const n = API.agentsOf(p.id).length; return `<span class="chip">${esc(p.name||'New person')} <b class="num">${n}</b></span>`; }).join('');
    return `<div class="row wrap" style="margin-bottom:12px"><div class="grow muted">Each agent has one owner. Owners see what it is doing, edit its instructions within your guardrails, and pause it. Approving messages is separate and follows Authority.</div><button class="btn" data-act="auto-assign">${ic('sparkle')} Auto-assign by department</button></div>
      <section class="card flush scroll"><table class="tbl"><thead><tr><th>Agent</th><th>Department</th><th>Owner</th></tr></thead><tbody>${rows}</tbody></table></section>
      <div class="sec-h"><h3>Agents per person</h3></div><div class="chips">${per}</div>`;
  };
  UI.chg('assign', (v,t,d) => API.assign(d.id, v));
  UI.act('auto-assign', () => { API.autoAssign(); UI.toast('Assigned by department'); });

  /* ===================== 4. CONNECTIONS (MCP) ===================== */
  let cm = {id:null, mode:'draft', busy:false};
  function connCard(k, usedBy){
    const m = MCPS[k], on = API.isOn(k), c = S().connections[k], [tl,tc] = MCP_TIER[m.tier];
    return `<div class="card conn"><span class="mono tile" style="--tile:${m.tile}" aria-hidden="true">${esc(m.mono)}</span><div class="body"><div class="row wrap"><b>${esc(m.name)}</b>${pill(tl,tc)}${on?pill('Connected','ok'):(usedBy?pill('Required','warn'):'')}</div>
      <p class="muted">${esc(m.desc)}</p>${usedBy?`<div class="who"><small>Needed by</small>${usedBy.map(id=>`<span class="chip">${esc((API.agent(id)||{}).name)}</span>`).join('')}</div>`:''}
      ${on?`<small>Access: ${esc((MCP_MODES.find(x=>x[0]===c.mode)||[])[1]||c.mode)}</small>`:''}</div>
      ${m.tier==='soon' ? '' : on ? `<button class="btn sm ghost" data-act="conn-off" data-id="${k}">Disconnect</button>` : `<button class="btn sm primary" data-act="conn-open" data-id="${k}">Connect</button>`}</div>`;
  }
  OA.connectionsView = function(){
    const s = S(), req = API.requiredTools(); const reqKeys = Object.keys(req), others = Object.keys(MCPS).filter(k => !req[k]);
    const miss = reqKeys.filter(k => !API.isOn(k));
    return `<div class="note info" style="margin-bottom:14px">${ic('lock',14)} Tools connect through ORBIT's policy gateway. ORBIT keeps the sign-in tokens, so agents never see your passwords, and every action is checked against what you allowed.</div>
      <div class="sec-h" style="margin-top:0"><h3>Required by your agents</h3>${reqKeys.length?pill(`${reqKeys.length-miss.length} of ${reqKeys.length} connected`, miss.length?'warn':'ok'):''}</div>
      ${reqKeys.length ? `<div class="stack">${reqKeys.map(k => connCard(k, req[k])).join('')}</div>` : UI.empty('No tools needed yet','Tools your agents need will appear here once you add agents.')}
      ${miss.length ? `<label class="row" style="margin-top:12px;align-items:flex-start"><input type="checkbox" data-ch="connect-later" ${s.org.connectLater?'checked':''} style="margin-top:3px;width:auto"><span>Connect later. Agents that need a missing tool start <b>paused</b> and resume when you connect it.</span></label>` : ''}
      <div class="sec-h"><h3>Other tools you can add</h3></div><div class="stack">${others.map(k => connCard(k, null)).join('')}</div>`;
  };
  UI.chg('connect-later', v => upd(s => { s.org.connectLater = !!v; }));
  UI.act('conn-open', (t,d) => { cm = {id:d.id, mode:'draft', busy:false}; connModal(); });
  function connModal(){
    const m = MCPS[cm.id], list = (a,c) => `<ul class="todo" style="${c||''}">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    UI.open(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="cmt"><div class="dh"><span class="mono tile" style="--tile:${m.tile}" aria-hidden="true">${esc(m.mono)}</span><h2 id="cmt" class="grow">Connect ${esc(m.name)}</h2><button class="btn sm ghost" data-act="close" aria-label="Close">${ic('x')}</button></div>

      <div class="guard"><h4>Agents can</h4>${list(m.can)}<h4 style="margin-top:8px">Always ask a person first</h4>${list(m.ask)}<h4 style="margin-top:8px">Never</h4>${list(m.never)}</div>
      <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="conn-go" ${cm.busy?'disabled':''}>${cm.busy?'Connecting…':'Continue with '+esc(m.auth.replace(' sign-in',''))}</button></div></section>`, {center:true});
  }
  UI.chg('conn-mode', v => { cm.mode = v; });
  UI.act('conn-go', () => { cm.busy = true; connModal(); const id = cm.id, mode = cm.mode; setTimeout(() => { UI.close(); API.connect(id, mode); UI.toast(MCPS[id].name + ' connected'); }, 700); });
  UI.act('conn-off', (t,d) => UI.confirm('Disconnect '+MCPS[d.id].name+'? Agents that need it will pause.', () => API.disconnect(d.id), 'Disconnect'));

  /* ---- standalone pages (after launch) ---- */

  Router.reg('admin','connections',{title:'Connections', render:() => UI.pageH('Connections','The tools your agents can use. Connect, change access, or disconnect.') + OA.connectionsView()});
  let tab = 'agents';
  UI.act('ag-tab', (t,d) => { tab = d.id; Shell.render(); });
  Router.reg('admin','agents',{title:'Agents', render:() => UI.pageH('Agents','Your AI teammates, who owns each one, and what it is allowed to do.', `<button class="btn primary" data-act="agent-new">${ic('plus')} New agent</button>`) +
    `<div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==='agents'}" data-act="ag-tab" data-id="agents">Team</button><button role="tab" aria-selected="${tab==='assign'}" data-act="ag-tab" data-id="assign">Assignments</button></div>` + (tab==='assign' ? OA.assignView() : OA.agentsView())});
  OA.openPromptEditor = null; // set by requests.js
})();

/* Org Admin onboarding wizard: 1 Org structure -> 2 Agents -> 3 Assign -> 4 Connections -> 5 Launch (hiring job, resumable). */
(function(){
  const {esc, ic, pill} = UI; const S = () => Store.get();
  const STEPS = [
    ['Org structure','Who is on the board and in each team', () => API.validateOrg(), () => OA.structureView()],
    ['Agents','Hire your AI teammates', () => API.validateAgents(), () => OA.agentsView()],
    ['Assign','Give every agent an owner', () => API.validateAssign(), () => OA.assignView()],
    ['Connections','Connect the tools they need', () => API.validateConnections(), () => OA.connectionsView()],
    ['Launch','Hire the team and go live', () => [], launchView]
  ];
  const errsUpTo = n => { for(let i = 0; i < n; i++){ const e = STEPS[i][2](); if(e.length) return {step:i+1, errs:e}; } return null; };
  const setStep = n => Store.update(s => { s.org.step = n; });
  const hasAgents = () => S().agents.length > 0;

  function launchView(){
    const s = S(), job = s.org.job, miss = Object.keys(API.requiredTools()).filter(k => !API.isOn(k));
    const paused = s.agents.filter(a => a.tools.some(t => miss.includes(t))).length;
    const stat = (n,l) => `<div class="card kpi"><small>${l}</small><b class="num">${n}</b></div>`;
    let body = '';
    if(!job){
      body = `<div class="kpis" style="margin-bottom:14px">${stat(s.departments.length,'Departments')}${stat(s.people.length,'People')}${stat(s.agents.length,'Agents')}${stat(Object.keys(s.connections).length,'Tools connected')}</div>
        ${paused ? `<div class="note" style="margin-bottom:12px">${paused} agent${paused>1?'s':''} will start paused until you connect their tools.</div>` : ''}
        <div class="note info" style="margin-bottom:14px">Launching creates your office, builds the org chart, hires each agent with its own workspace and budget, applies tool permissions and invites your people. No agent runs until this finishes.</div>
        ${CFG.DEV ? `<label class="row" style="margin-bottom:12px"><input type="checkbox" id="simfail" style="width:auto"> Dev: simulate a failure at "workspace" to test retry</label>` : ''}
        <button class="btn primary" data-act="launch">${ic('rocket')} Hire the team</button>`;
    } else {
      const done = job.steps.filter(x => x.status === 'done').length, pct = Math.round(done / job.steps.length * 100);
      const failed = job.steps.some(x => x.status === 'fail'), stalled = !failed && !job.done && !API.isJobActive();
      body = `<div class="row" style="margin-bottom:10px"><div class="bar grow" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><b class="num">${pct}%</b></div>
        <ul class="job gl" style="gap:0">${job.steps.map(x => `<li><span class="s ${x.status==='done'?'done':x.status==='run'?'run':x.status==='fail'?'fail':''}">${x.status==='done'?ic('check',12):x.status==='fail'?ic('x',12):''}</span><span class="grow" style="${x.status==='pending'?'color:var(--muted)':''}">${esc(x.label)}</span></li>`).join('')}</ul>
        ${job.error ? `<div class="note err" role="alert" style="margin-top:12px">${esc(job.error)}</div>` : ''}
        ${failed || stalled ? `<div style="margin-top:12px"><button class="btn primary" data-act="retry">${failed?'Retry from this step':'Resume'}</button></div>` : ''}
        ${s.org.launched ? `<div class="note ok" style="margin-top:12px"><b>Your office is live.</b> ${paused?paused+' agent'+(paused>1?'s are':' is')+' paused until their tools are connected. ':''}Invitations were sent to your team.</div>
          <div style="margin-top:12px"><a class="btn primary" href="${Router.href('dashboard')}">Go to your dashboard</a></div>` : ''}`;
    }
    return `<section class="card pad"><h3 style="margin-bottom:10px">${s.org.launched?'Done':'Ready to launch?'}</h3>${body}</section>`;
  }
  UI.act('launch', () => { const sf = document.getElementById('simfail'); API.startLaunch(sf && sf.checked); });
  UI.act('retry', () => API.retryJob());
  UI.act('wiz-go', (t,d) => { const b = errsUpTo(+d.n - 1); if(b){ UI.toast('Finish step '+b.step+' first'); return; } setStep(+d.n); });
  UI.act('wiz-next', () => { const n = S().org.step; const e = STEPS[n-1][2](); if(e.length) return; setStep(n + 1); });
  UI.act('wiz-back', () => setStep(Math.max(1, S().org.step - 1)));

  Router.reg('admin','onboarding',{title:'Set up your office', render(){
    const s = S(), cur = Math.min(5, Math.max(1, s.org.step));
    if(s.org.launched && !(s.org.job && !s.org.job.seen)){ /* fall through to show final state once */ }
    const block = errsUpTo(cur - 1); if(block && block.step < cur){ setTimeout(() => setStep(block.step), 0); }
    const errs = STEPS[cur-1][2]();
    const stepper = `<nav class="stepper" aria-label="Setup steps">${STEPS.map((x,i) => { const n = i + 1, ok = n < cur && !STEPS[i][2]().length; const lock = !!errsUpTo(n - 1);
      return `<button class="step ${n===cur?'on':''} ${ok?'done':''}" data-act="wiz-go" data-n="${n}" ${lock&&n!==cur?'disabled':''} ${n===cur?'aria-current="step"':''}><span class="n">${ok?ic('check',13):n}</span><span><b>${x[0]}</b><small>${x[1].length>26?x[1].slice(0,24)+'…':x[1]}</small></span></button>`; }).join('')}</nav>`;
    const foot = cur === 5 ? `<div class="wfoot"><button class="btn" data-act="wiz-back" ${s.org.job&&!s.org.launched?'disabled':''}>${ic('left')} Back</button><span></span></div>`
      : `<div class="wfoot"><button class="btn" data-act="wiz-back" ${cur===1?'disabled':''}>${ic('left')} Back</button>
        <div>${errs.length ? `<div class="note" style="text-align:left;margin-bottom:8px" role="status"><b>To continue:</b><ul class="todo">${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}<div style="text-align:right"><button class="btn primary" data-act="wiz-next" ${errs.length?'disabled':''}>Continue ${ic('right')}</button></div></div></div>`;
    const intro = ['Set up who is in your business. Leaders form the board that approves big decisions.','Hire one Coordinator, then specialists. The chart is a strict tree: every agent has exactly one manager.','Give every agent one owner so someone is responsible for it.','These are the tools your agents need. Connect each one so they can start working.','Review and launch. This creates everything in one go.'][cur-1];
    return UI.pageH(`Step ${cur} of 5: ${STEPS[cur-1][0]}`, intro) + stepper + STEPS[cur-1][3]() + foot;
  }});

/* Requests inbox: review a user's agent request, edit its instructions, add guardrails, decide. Also edit any running agent's prompt + guardrails. */
(function(){
  const {esc, ic, pill} = UI; const S = () => Store.get();
  const RQ = {pending:['warn','Waiting for you'],approved:['ok','Approved'],changes:['brand','Changes requested'],rejected:['err','Declined']};
  let p = null; // panel draft {type:'review'|'agent', id, prompt, guards, note, err}

  OA.guardEditor = function(guards){
    return `<ul class="gl">${guards.map((g,i) => `<li><span>${esc(g)}</span><button class="btn sm ghost" data-act="g-del" data-id="${i}" aria-label="Remove guardrail: ${esc(g)}">Remove</button></li>`).join('') || '<li><span class="muted">No guardrails yet.</span></li>'}</ul>

  };
  function drawer(){
    const s = S(), isReq = p.type === 'review';

      ${isReq ? `<div class="guard"><h4>What ${esc(by?by.name.split(' ')[0]:'they')} asked for</h4><p style="font-size:13px"><b>Job:</b> ${esc(r.purpose)}</p><p style="font-size:13px"><b>Why:</b> ${esc(r.reason)}</p><p style="font-size:13px"><b>Tools:</b> ${esc(r.tools.map(API.toolName).join(', ')||'none')}${r.tools.some(t=>!API.isOn(t))?` ${pill('Some not connected yet','warn')}`:''}</p></div>` : `<div class="doing"><small>Right now</small>${esc(a.doing)}</div>`}

      <div class="field"><span class="lbl">Guardrails</span><p class="help" style="margin:0 0 6px">Guardrails always win over instructions. The owner can read them but not change them.</p>${ro ? `<ul class="gl">${p.guards.map(g=>`<li><span>${esc(g)}</span></li>`).join('')}</ul>` : OA.guardEditor(p.guards)}</div>
      ${isReq && !ro ? `<div class="field"><label for="pn">Note to ${esc(by?by.name.split(' ')[0]:'them')}</label><input type="text" id="pn" value="${esc(p.note)}" data-in="rv-note" placeholder="Required if you request changes or decline">${p.err?`<p class="err-t" role="alert">${esc(p.err)}</p>`:''}</div>` : ''}
      ${ro ? `<div class="note ${r.status==='approved'?'ok':r.status==='rejected'?'err':''}">${esc(RQ[r.status][1])}${r.adminNote?': '+esc(r.adminNote):''}</div>` : ''}
      <div class="foot">${isReq && !ro ? `<button class="btn" data-act="rv-decide" data-d="rejected">Decline</button><button class="btn" data-act="rv-decide" data-d="changes">Request changes</button><button class="btn primary" data-act="rv-decide" data-d="approved">Approve and start</button>` : !isReq ? `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="rv-save">Save changes</button>` : ''}</div></section>`);
  }
  OA.openPromptEditor = id => { const a = API.agent(id); p = {type:'agent', id, prompt:a.prompt, guards:a.guardrails.slice(), note:'', err:''}; drawer(); };
  UI.act('rv-open', (t,d) => { const r = API.agent && S().requests.find(x => x.id === d.id); p = {type:'review', id:d.id, prompt:r.prompt, guards:S().org.guardrails.slice(), note:r.adminNote || '', err:''}; drawer(); });
  UI.act('agent-admin', (t,d) => OA.openPromptEditor(d.id));
  UI.inp('rv-prompt', v => { p.prompt = v; }); UI.inp('rv-note', v => { p.note = v; });
  const addG = txt => { txt = (txt||'').trim(); if(!txt) return; if(p.guards.includes(txt)){ UI.toast('Already added'); return; } p.guards.push(txt); drawer(); const i = document.getElementById('gnew'); if(i) i.focus(); };
  UI.act('g-add', () => addG(document.getElementById('gnew').value)); UI.act('g-sug', (t,d) => addG(d.id));
  UI.act('g-del', (t,d) => { p.guards.splice(+d.id, 1); drawer(); });
  UI.act('rv-save', () => { if(p.prompt.trim().length < 20){ UI.toast('Instructions need at least 20 characters'); return; } const a = API.agent(p.id); UI.close(); API.savePrompt(p.id, p.prompt, 'Org Admin', p.guards); UI.toast(a.name + ' updated. Applies from the next run.'); });
  UI.act('rv-decide', (t,d) => { const dec = d.d;

    UI.close(); API.decide(p.id, dec, o); UI.toast(dec==='approved' ? r.name+' is set up for '+(person?person.name.split(' ')[0]:'them') : 'Decision sent'); });

  Router.reg('admin','requests',{title:'Requests', render(){

      <button class="btn sm ${r.status==='pending'?'primary':''}" data-act="rv-open" data-id="${r.id}">${r.status==='pending'?'Review':'View'}</button></div>`; };
    return UI.pageH('Requests','Agent requests from your team. Review, adjust the instructions, add guardrails, then approve.') +
      `<section class="card list flush" aria-label="Pending requests">${pend.length ? pend.map(row).join('') : '<div class="empty"><h3>Nothing to review</h3><p>New requests from your team appear here.</p></div>'}</section>` +
      (done.length ? `<div class="sec-h"><h3>Decided</h3></div><section class="card list flush">${done.map(row).join('')}</section>` : '') +
      `<div class="sec-h"><h3>Recent changes</h3></div><section class="card list flush">${s.audit.slice(0,8).map(x => `<div class="item" style="padding:10px 16px"><div class="grow"><b>${esc(x.who)}</b> ${esc(x.what)} <small>· ${UI.ago(x.at)}</small></div></div>`).join('')}</section>`;
  }});
})();

/* Performance per agent: runs, trend, success, speed, human edits, cost. */
(function(){

  UI.act('perf-sort', (t,d) => { sort = {k:d.id, dir: sort.k===d.id ? -sort.dir : (d.id==='name'||d.id==='owner'?1:-1)}; Shell.render(); });
  const spark = d => { const mx = Math.max(...d,1), w=70, h=22; return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${d.map((v,i)=>(i*(w/(d.length-1))).toFixed(1)+','+(h-2-(v/mx)*(h-4)).toFixed(1)).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`; };
  Router.reg('admin','performance',{title:'Performance', render(){
    const s = S(), A = s.agents; if(!A.some(a => a.provisioned)) return UI.pageH('Performance','How each agent is doing.') + UI.empty('No data yet','Performance appears after your office goes live.', `<a class="btn primary" href="${Router.href('onboarding')}">Continue setup</a>`);
    const own = a => (API.person(a.ownerId)||{name:'Unassigned'}).name, r7 = API.runs7;

    const rows = A.slice().sort((x,y) => { const a = val(x), b = val(y); return (typeof a==='string' ? a.localeCompare(b) : a-b) * sort.dir; });
    const th = (k,l) => `<th scope="col" aria-sort="${sort.k===k?(sort.dir>0?'ascending':'descending'):'none'}"><button data-act="perf-sort" data-id="${k}">${l}${sort.k===k?(sort.dir>0?' ▲':' ▼'):''}</button></th>`;
    const bad = A.filter(a => a.provisioned && (a.perf.success < 90 || a.perf.edited >= 40)), tot = A.reduce((t,a)=>t+r7(a),0), cost = A.reduce((t,a)=>t+a.perf.cost7,0);
    return UI.pageH('Performance','How each agent did over the last 7 days.') +
      (bad.length ? `<div class="attn" role="note"><b>Needs attention:</b> ${bad.map(a => esc(a.name)+' ('+(a.perf.success<90?a.perf.success+'% success':a.perf.edited+'% of drafts edited')+')').join(', ')}.</div>` : '') +
      `<section class="card flush scroll"><table class="tbl"><thead><tr>${th('name','Agent')}${th('owner','Owner')}<th scope="col">Status</th>${th('runs','Runs')}<th scope="col">Trend</th>${th('success','Success')}${th('time','Avg time')}${th('edited','Edited by people')}${th('cost','Cost')}${th('cpr','Per run')}</tr></thead><tbody>
      ${rows.map(a => `<tr class="row-b" tabindex="0" data-act="agent-admin" data-id="${a.id}"><td><b>${esc(a.name)}</b></td><td>${esc(own(a))}</td><td>${statusPill(a.status)}</td><td class="num">${r7(a)}</td><td>${spark(a.perf.daily)}</td><td class="num ${a.perf.success<90?'warn-t':a.perf.success>=97?'ok-t':''}">${a.perf.success}%</td><td class="num">${a.perf.avgSec.toFixed(1)}s</td><td class="num ${a.perf.edited>=40?'warn-t':''}">${a.perf.edited}%</td><td class="num">${UI.money(a.perf.cost7)}</td><td class="num">${UI.money(a.perf.cost7/Math.max(1,r7(a)))}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="3"><b>All agents</b></td><td class="num"><b>${tot}</b></td><td colspan="4"></td><td class="num"><b>${UI.money(cost)}</b></td><td class="num"><b>${UI.money(cost/Math.max(1,tot))}</b></td></tr></tfoot></table></section>
      <p class="muted" style="margin-top:10px">Success means the run finished without an error or a rejected result. "Edited by people" is the share of drafts a person changed before approving; a high number usually means the instructions need work.</p>`;
  }});

    if(!s.org.launched) return head + UI.empty('Your office is being set up','Your Org Admin is still hiring the team. You will see your agents here as soon as it goes live.');
    if(!a.length) return head + UI.empty('No agents assigned yet','Ask your Org Admin to assign one, or request a new agent.', `<a class="btn primary" href="${Router.href('new')}">Request an agent</a>`);
    return head + `<section class="kpis" aria-label="Summary">${kpi('Running now', API.running(a), 'of '+a.length, true)}${kpi('Waiting for approval', a.filter(x=>x.status==='waiting').length)}${kpi('Runs today', a.reduce((t,x)=>t+x.runsToday,0))}${kpi('Spent today', money(a.reduce((t,x)=>t+x.costToday,0)))}</section><div class="grid">${a.map(card).join('')}</div>`;
  }});
})();

/* User: request a new agent (goes to the Org Admin) and track the answer. */
(function(){
  const {esc, ic, pill} = UI; const S = () => Store.get();
  const blank = () => ({name:'', purpose:'', prompt:'', reason:'', tools:[], errs:{}, revising:null}); let q = blank();
  const RQ = {pending:['warn','Waiting for Org Admin'],approved:['ok','Approved'],changes:['brand','Changes requested'],rejected:['err','Not approved']};
  UI.inp('rq-name', v => { q.name = v; }); UI.inp('rq-purpose', v => { q.purpose = v; }); UI.inp('rq-prompt', v => { q.prompt = v; }); UI.inp('rq-reason', v => { q.reason = v; });
  UI.act('u-tool', (t,d) => { const i = q.tools.indexOf(d.id); i<0 ? q.tools.push(d.id) : q.tools.splice(i,1); t.setAttribute('aria-pressed', i<0); });
  UI.act('u-submit', () => { const e = {};
    if(q.name.trim().length < 2) e.name = 'Give the agent a name.'; if(!q.purpose.trim()) e.purpose = 'Describe its job in one line.';
    if(q.prompt.trim().length < 20) e.prompt = 'Write at least 20 characters of instructions.'; if(!q.reason.trim()) e.reason = 'Tell your admin why this helps.';
    q.errs = e; if(Object.keys(e).length){ Shell.render(); return; }
    API.submitRequest(Shell.me('user').id, q); q = blank(); UI.toast('Sent to your Org Admin. You will see the answer here.'); });
  UI.act('u-cancel', (t,d) => { API.cancelRequest(d.id); UI.toast('Request cancelled'); });
  UI.act('u-revise', (t,d) => { const r = S().requests.find(x => x.id === d.id); q = {name:r.name, purpose:r.purpose, prompt:r.prompt, reason:r.reason, tools:r.tools.slice(), errs:{}, revising:r.id}; Shell.render(); window.scrollTo(0,0); });
  const err = k => q.errs[k] ? `<p class="err-t" role="alert">${q.errs[k]}</p>` : '';
  Router.reg('user','new',{title:'Request an agent', render(_, m){
    const s = S(), mineReq = s.requests.filter(r => r.by === m.id).sort((a,b) => b.at - a.at);
    const form = !s.org.launched ? UI.empty('Requests open once your office is live','Your Org Admin is still setting things up.') : `<section class="card pad"><div class="note info" style="margin-bottom:14px">Your Org Admin reviews every request. They may add guardrails or edit the instructions before it starts.</div>
      <div class="field"><label for="rn">Agent name</label><input type="text" id="rn" value="${esc(q.name)}" data-in="rq-name" placeholder="Proposal Chaser">${err('name')}</div>
      <div class="field"><label for="rp">Its job, in one line</label><input type="text" id="rp" value="${esc(q.purpose)}" data-in="rq-purpose" placeholder="Follow up on proposals that go quiet">${err('purpose')}</div>
      <div class="field"><label for="ri">Instructions</label><textarea id="ri" data-in="rq-prompt" style="min-height:110px" placeholder="When a proposal has had no reply for 3 days, draft a friendly nudge...">${esc(q.prompt)}</textarea>${err('prompt')}<p class="help">Describe it like you would to a new assistant.</p></div>
      <div class="field"><span class="lbl">Tools it needs</span><div class="chips" role="group" aria-label="Tools">${Object.entries(MCPS).map(([k,t]) => `<button type="button" class="chip" data-act="u-tool" data-id="${k}" aria-pressed="${q.tools.includes(k)}" ${t.tier==='soon'?'disabled title="Coming soon"':''}>${esc(t.name)}</button>`).join('')}</div></div>
      <div class="field"><label for="rr">Why do you need it?</label><input type="text" id="rr" value="${esc(q.reason)}" data-in="rq-reason" placeholder="We lose deals when follow-ups are late">${err('reason')}</div>
      <button class="btn primary" data-act="u-submit">${ic('send')} ${q.revising?'Resend to Org Admin':'Send to Org Admin'}</button></section>`;
    const list = mineReq.length ? `<section class="card list flush">${mineReq.map(r => { const [c,l] = RQ[r.status];
      return `<div class="item"><div class="grow"><div class="row wrap"><b>${esc(r.name)}</b>${pill(l,c)}</div><p class="muted">${esc(r.purpose)}</p><small>Asked ${UI.ago(r.at)} · Tools: ${esc(r.tools.map(API.toolName).join(', ')||'none')}</small>
        ${r.adminNote?`<div class="note ${r.status==='approved'?'ok':r.status==='rejected'?'err':''}" style="margin-top:6px"><b>Org Admin:</b> ${esc(r.adminNote)}</div>`:''}</div>
        ${r.status==='pending'?`<button class="btn sm ghost" data-act="u-cancel" data-id="${r.id}">Cancel</button>`:''}${r.status==='changes'?`<button class="btn sm" data-act="u-revise" data-id="${r.id}">Revise and resend</button>`:''}</div>`; }).join('')}</section>` : '<div class="card empty">No requests yet.</div>';
    return UI.pageH('Request an agent','Need help with a task? Describe it and your Org Admin will set it up.') + form + `<div class="sec-h"><h3>My requests</h3></div>` + list;
  }});
})();

/* User: receipts for what my agents did. */
(function(){
  const {esc, ic, pill} = UI; const S = () => Store.get(); const open = {};
  UI.act('u-exp', (t,d) => { open[d.id] = !open[d.id]; Shell.render(); });
  Router.reg('user','activity',{title:'Activity', render(_, m){
    const s = S(), ids = s.agents.filter(a => a.ownerId === m.id).map(a => a.id), items = s.activity.filter(r => ids.includes(r.agentId));
    if(!items.length) return UI.pageH('Activity','Everything your agents did, with the reason.') + UI.empty('Nothing yet','When your agents do work, each action appears here with why it happened.');
    return UI.pageH('Activity','Everything your agents did, with the reason.') + `<section class="card list flush">${items.map(r => { const a = API.agent(r.agentId), o = !!open[r.id];
      return `<div class="item" style="flex-direction:column;gap:6px"><button class="row" style="width:100%;background:none;border:0;padding:0;text-align:left" data-act="u-exp" data-id="${r.id}" aria-expanded="${o}"><span class="mono sm" aria-hidden="true">${esc(UI.initials(a?a.name:'?'))}</span><span class="grow"><b>${esc(r.title)}</b><small style="display:block">${esc(a?a.name:'')} · ${UI.ago(r.t)}</small></span>${pill(r.status==='waiting'?'Waiting':'Done', r.status==='waiting'?'warn':'ok')}<small class="num">${UI.money(r.cost)}</small></button>
        ${o?`<div class="doing" style="width:100%"><small>Why</small>${esc(r.why)}<small style="margin-top:4px">Took ${r.dur}s</small></div>`:''}</div>`; }).join('')}</section>`;
  }});
})();

/* Super Admin: every customer office, with health and cost. */
(function(){
  const {esc, ic, pill} = UI; const S = () => Store.get();
  window.FleetRows = () => { const s = S(), live = s.org.launched;
    const cur = {id:'ws_current', name:s.org.name, domain:s.org.domain, status:live?'live':'onboarding', agents:s.agents.length, cost:+s.agents.reduce((t,a)=>t+a.perf.cost7,0).toFixed(2), version:'1.4.2', health:'ok', admin:(s.people.find(p=>p.access==='admin')||{}).email||''};
    return [cur].concat(s.fleet || [], Fleet.others()); };
  const ST = {live:['ok','Live'], onboarding:['brand','Org Admin onboarding'], awaiting:['warn','Awaiting onboarding']};
  Router.reg('super','fleet',{title:'Offices', render(){
    const rows = FleetRows(), live = rows.filter(r=>r.status==='live').length;
    return UI.pageH('Offices','Every customer office OrbitumAI runs. Each one has its own private instance.', `<a class="btn primary" href="${Router.href('provision')}">${ic('plus')} New office</a>`) +
      `<section class="kpis">${UI.kpi('Offices', rows.length,'',true)}${UI.kpi('Live', live)}${UI.kpi('Agents', rows.reduce((t,r)=>t+r.agents,0))}${UI.kpi('Spend (7 days)', UI.money(rows.reduce((t,r)=>t+r.cost,0)))}</section>
      <section class="card flush scroll"><table class="tbl"><thead><tr><th>Office</th><th>Status</th><th>Agents</th><th>Spend (7 days)</th><th>Version</th><th>Health</th></tr></thead><tbody>${rows.map(r => `<tr class="row-b" tabindex="0" data-act="office-open" data-id="${r.id}"><td><b>${esc(r.name)}</b><small style="display:block">${esc(r.domain)}</small></td><td>${pill(ST[r.status][1],ST[r.status][0])}</td><td class="num">${r.agents}</td><td class="num">${UI.money(r.cost)}</td><td>${esc(r.version)}</td><td>${pill(r.health==='ok'?'Healthy':'Check',r.health==='ok'?'ok':'warn')}</td></tr>`).join('')}</tbody></table></section>`;
  }});
  UI.act('office-open', (t,d) => Router.go('office', d.id));
})();

/* Super Admin: one office. Shows how each customer-facing object maps to the runtime (operator-only view). */
(function(){
  const {esc, pill, statusPill} = UI; const S = () => Store.get();
  Router.reg('super','office',{title:id => { const r = (window.FleetRows?FleetRows():[]).find(x=>x.id===id); return r ? r.name : 'Office'; }, render(id){
    const rows = FleetRows(), r = rows.find(x => x.id === id); if(!r) return UI.empty('Office not found','It may have been removed.', `<a class="btn" href="${Router.href('fleet')}">Back to offices</a>`);
    const back = `<a class="btn sm ghost" href="${Router.href('fleet')}">Back to offices</a>`;
    if(id !== 'ws_current') return UI.pageH(esc(r.name), esc(r.domain), back) + `<div class="card pad"><div class="note info">Detail for this office comes from its own instance. This prototype shows full runtime detail for the office you are building in the Org Admin dashboard.</div><p style="margin-top:10px">Admin: ${esc(r.admin)} · ${r.agents} agents · version ${esc(r.version)}</p></div>`;
    const s = S(), ag = s.agents;
    return UI.pageH(esc(r.name), esc(r.domain), back) +
      `<section class="kpis">${UI.kpi('Agents', ag.length,'',true)}${UI.kpi('Provisioned', ag.filter(a=>a.provisioned).length)}${UI.kpi('Tools connected', Object.keys(s.connections).length)}${UI.kpi('Org chart', ag.some(a=>a.type==='coordinator')?'Valid':'Incomplete')}</section>
      ${s.org.launched ? '' : `<div class="note" style="margin-bottom:14px">The Org Admin is still onboarding. Runtime profiles are created when they launch.</div>`}
      <section class="card flush scroll"><table class="tbl"><thead><tr><th>Agent</th><th>Type</th><th>Reports to</th><th>Runtime id</th><th>Profile</th><th>Adapter</th><th>Budget</th><th>Status</th></tr></thead><tbody>
      ${ag.map(a => { const m = API.agent(a.managerId); return `<tr><td><b>${esc(a.name)}</b></td><td>${a.type}</td><td>${esc(m?m.name:'The board')}</td><td>${a.runtime?`<code>${esc(a.runtime.paperclipId)}</code>`:'<span class="muted">not created</span>'}</td><td>${a.runtime?`<code>${esc(a.runtime.hermesProfile)}</code>`:''}</td><td>${a.runtime?esc(a.runtime.adapter):''}</td><td class="num">$${a.budget}/mo</td><td>${statusPill(a.status)}</td></tr>`; }).join('') || '<tr><td colspan="8" class="muted">No agents yet.</td></tr>'}</tbody></table></section>
      <p class="muted" style="margin-top:10px">Each agent is one manager-reporting teammate in the office's control plane, with its own isolated runtime profile reached through the gateway adapter. Budgets map to the control plane's auto-pause limits.</p>`;
  }});
})();

/* Super Admin: provision a new customer office (instance, org shell, tool gateway, admin invite). */
(function(){
  const {esc, ic} = UI; let f = {name:'', domain:'', email:'', errs:{}}, run = null;
  UI.inp('pv-name', v => { f.name = v; }); UI.inp('pv-domain', v => { f.domain = v; }); UI.inp('pv-email', v => { f.email = v; });
  UI.act('pv-go', () => { const e = {}; if(f.name.trim().length < 2) e.name = 'Enter the business name.'; if(!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(f.domain.trim())) e.domain = 'Enter a domain like office.acme.com.'; if(!API.emailOk(f.email)) e.email = 'Enter the Org Admin email.';
    f.errs = e; if(Object.keys(e).length){ Shell.render(); return; }
    run = {i:0, name:f.name.trim(), domain:f.domain.trim(), email:f.email.trim()}; Shell.render(); step(); });
  function step(){ if(!run) return; if(run.i >= Fleet.steps.length){
      Store.update(s => { (s.fleet = s.fleet || []).push({id:Store.uid('ws_'), name:run.name, domain:run.domain, status:'awaiting', agents:0, cost:0, version:'1.4.2', health:'ok', admin:run.email}); });
      run.done = true; Shell.render(); return; }
    Shell.render(); setTimeout(() => { run.i++; step(); }, 650); }
  UI.act('pv-reset', () => { run = null; f = {name:'', domain:'', email:'', errs:{}}; Shell.render(); });
  Router.reg('super','provision',{title:'New office', render(){
    if(run){ const pct = Math.round(Math.min(run.i, Fleet.steps.length) / Fleet.steps.length * 100);
      return UI.pageH('Setting up '+esc(run.name), run.done ? 'The office is ready. The Org Admin received an invitation.' : 'Creating a private instance. This takes a moment.') +
        `<section class="card pad"><div class="row" style="margin-bottom:10px"><div class="bar grow"><i style="width:${pct}%"></i></div><b class="num">${pct}%</b></div><ul class="job gl" style="gap:0">${Fleet.steps.map(([k,l],i) => `<li><span class="s ${i<run.i?'done':i===run.i&&!run.done?'run':''}">${i<run.i?ic('check',12):''}</span><span class="grow">${esc(l)}</span></li>`).join('')}</ul>
        ${run.done ? `<div class="row" style="margin-top:14px"><a class="btn primary" href="${Router.href('fleet')}">View offices</a><button class="btn" data-act="pv-reset">Provision another</button></div>` : ''}</section>`; }
    const e = f.errs, er = k => e[k] ? `<p class="err-t" role="alert">${e[k]}</p>` : '';
    return UI.pageH('New office','Each customer gets their own private instance, database and domain.') +
      `<section class="card pad" style="max-width:560px"><div class="field"><label for="pn">Business name</label><input type="text" id="pn" value="${esc(f.name)}" data-in="pv-name" placeholder="Acme Advisors">${er('name')}</div>
      <div class="field"><label for="pd">Office domain</label><input type="text" id="pd" value="${esc(f.domain)}" data-in="pv-domain" placeholder="office.acme.com">${er('domain')}</div>
      <div class="field"><label for="pe">Org Admin email</label><input type="email" id="pe" value="${esc(f.email)}" data-in="pv-email" placeholder="owner@acme.com">${er('email')}<p class="help">They receive an invitation and complete onboarding: org structure, agents, assignments and tools.</p></div>
      <button class="btn primary" data-act="pv-go">${ic('rocket')} Provision office</button></section>`;
  }});
})();
