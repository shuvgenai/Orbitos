# Orbi's Hermes profile. Orbi reads unclear leads and stuck drafts and answers with a verdict.
# It needs no Hermes toolset at all: its issue actions come from Paperclip, not from Hermes.
model: anthropic/claude-sonnet-5

memory:
  memory_enabled: false
  user_profile_enabled: false

skills:
  write_approval: true
  auto_load: []

agent:
  disabled_toolsets:
    - terminal
    - file
    - web
    - browser
    - code_execution
    - vision
    - mcp
    - creative
    - productivity
    - memory

# Scheduling is deliberately absent from this file. Hermes has no config key that turns cron
# off: `hermes config get cron.enabled` answers "'cron.enabled' is not a recognized config key".
# Cron is a per-job system (`hermes cron list|create|pause`), so "no schedules" means an empty
# job list, which the runtime posture check asserts with `hermes -p orbi cron list` (COST-2,
# FLT-7). Do not add a cron key here; it would read as containment that is not there.
