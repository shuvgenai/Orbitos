# Scout's Hermes profile. Scout reads hostile lead email, so everything it does not need is off.
# Hermes profiles do not sandbox the filesystem (SEC-2a), which is why the container boundary in
# template/compose.yml carries the rest of the containment.
model: anthropic/claude-sonnet-5

memory:
  # No cross-lead memory: each draft is written from that lead's own email, the owner's tone
  # samples and the facts file (Eng v3 D6).
  memory_enabled: false
  user_profile_enabled: false

skills:
  # Scout cannot write itself new abilities (CEO R7).
  write_approval: true
  auto_load: []

agent:
  # Allowlist by subtraction: web search and fetch stay, everything else goes (SEC-2a).
  # The image ships a Playwright browser pack, so disabling browser here is load-bearing.
  disabled_toolsets:
    - terminal
    - file
    - browser
    - code_execution
    - vision
    - mcp
    - creative
    - productivity
    - memory

# Scheduling is deliberately absent from this file. Hermes has no config key that turns cron
# off: `hermes config get cron.enabled` answers "'cron.enabled' is not a recognized config key".
# Cron is a per-job system (`hermes cron list|create|pause`), so "no schedules" means an empty
# job list, which the runtime posture check asserts with `hermes -p scout cron list` (COST-2,
# FLT-7). Do not add a cron key here; it would read as containment that is not there.
