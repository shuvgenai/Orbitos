# Scout's Hermes profile. Scout reads hostile lead email, so everything it does not need is off.
# Hermes profiles do not sandbox the filesystem (SEC-2a), which is why the container boundary in
# template/compose.yml carries the rest of the containment.
model: anthropic/claude-sonnet-5

memory:
  # No cross-lead memory: each draft is written from that lead's own email, the owner's tone
  # samples and the facts file (Eng v3 D6).
  memory_enabled: false
  user_profile_enabled: false

skills:
  # Scout cannot write itself new abilities (CEO R7).
  write_approval: true
  auto_load: []

agent:
  # Allowlist by subtraction, so every key in Hermes' CONFIGURABLE_TOOLSETS registry must appear
  # here. Scout keeps none (CEO v2 D10, founder 2026-10-01). The image exposes `web` as one
  # toolset holding web_search and web_extract together, so "search only" cannot be configured;
  # a search query also carries data out, which is the leak S3-EXFIL closed. Scout therefore
  # drafts from the lead's email, the owner's tone samples and the facts file alone. The research
  # and draft split in TODOS.md P3 is how research comes back.
  # The registry is at /opt/hermes/hermes_cli/tools_config.py in the pinned image; if an upgrade
  # adds a toolset, it is ENABLED until it is listed here, which is what the posture check catches.
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - stt
    - skills
    - todo
    - kanban
    - memory
    - context_engine
    - session_search
    - connections
    - clarify
    - delegation
    - cronjob
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    - computer_use

# Scheduling is deliberately absent from this file. Hermes has no config key that turns cron off:
# `hermes config get cron.enabled` answers "'cron.enabled' is not a recognized config key". Cron is
# a per-job system (`hermes cron list|create|pause`) plus the `cronjob` toolset disabled above, so
# "no schedules" means an empty job list, which the runtime posture check asserts with
# `hermes -p scout cron list` (COST-2, FLT-7). Do not add a cron key here; it would read as
# containment that is not there.
