# Per-instance stack (DEP-1). Rendered per customer with that instance's .env (DEP-3).
# The Paperclip + Hermes container is added by the Stage 0b plan.
name: orbit-instance

x-program: &program
  build:
    context: ..
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 3s
    retries: 5

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "timezone=UTC"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      ORBIT_DB_PASSWORD: ${ORBIT_DB_PASSWORD:?}
      PAPERCLIP_DB_PASSWORD: ${PAPERCLIP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  paperclip:
    # The engine: Paperclip plus Hermes in one container (Eng v3 D3). No Gmail token, no Resend key,
    # no TOKEN_ENCRYPTION_KEY, and the paperclip database login only (SEC-2a). See engine/README.md.
    build:
      context: ./engine
      args:
        PAPERCLIP_REF: ${PAPERCLIP_REF:?}
        HERMES_REF: ${HERMES_REF:?}
    restart: unless-stopped
    read_only: true # SEC-2a; every writable path below is a volume
    environment:
      DATABASE_URL: postgresql://paperclip_app:${PAPERCLIP_DB_PASSWORD:?}@postgres:5432/paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated # DEP-5
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private # DEP-5
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?}
      BETTER_AUTH_SECRET: ${PAPERCLIP_AUTH_SECRET:?}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_SIGNING_SECRET:?}
      ANTHROPIC_API_KEY: ${ENGINE_ANTHROPIC_API_KEY:?} # its own key, not the Front Desk's (SEC-10)
    volumes:
      - paperclip_home:/paperclip # the image's own HOME and PAPERCLIP_HOME
      - hermes_data:/opt/data # HERMES_HOME: both profiles, their sessions and logs
    tmpfs: ["/tmp"] # Hermes' XDG_RUNTIME_DIR is /tmp/hermes-runtime
    ports: ["127.0.0.1:3100:3100"] # reached over the host's tailnet only (SEC-1, DEP-5)
    networks: [data, egress] # data to reach Postgres and the Front Desk; egress for model calls
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30 # first boot runs 278 migrations

  web:
    <<: *program
    build: { context: .., args: { APP: web } }
    environment:
      PORT: "8080"
    ports: ["127.0.0.1:8080:8080"]
    networks: [edge]

  api:
    <<: *program
    build: { context: .., args: { APP: api } }
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://orbit_app:${ORBIT_DB_PASSWORD:?}@postgres:5432/orbit
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:?}
    ports: ["127.0.0.1:8081:8080"]
    networks: [data, edge, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *program
    build: { context: .., args: { APP: worker } }
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://orbit_app:${ORBIT_DB_PASSWORD:?}@postgres:5432/orbit
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:?}
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontdesk:
    <<: *program
    build: { context: .., args: { APP: frontdesk } }
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://orbit_app:${ORBIT_DB_PASSWORD:?}@postgres:5432/orbit
      REDIS_URL: redis://redis:6379
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:?}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:?}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      PAPERCLIP_API_URL: http://paperclip:3100 # the service key is created per instance (E3-T7)
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

networks:
  data:
    internal: true # no internet route; Postgres and Redis live only here (SEC-1)
  edge: {}         # web and api, reached by the host's reverse proxy via 127.0.0.1
  egress: {}       # outbound internet for Gmail, Resend and model calls

volumes:
  pgdata: {}
  paperclip_home: {} # Paperclip data and its own hourly backups; DEC-2 wipes it with `down -v`
  hermes_data: {} # HERMES_HOME: profiles, sessions, logs (DAT-3 purge target, E3-T5)
