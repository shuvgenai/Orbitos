# Per-instance stack (DEP-1). Rendered per customer with that instance's .env (DEP-3).
# The Paperclip + Hermes container is added by the Stage 0b plan.
name: orbit-instance

x-program: &program
  build:
    context: ..
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 3s
    retries: 5

services:
  postgres:
    # Digest-pinned 2026-11-09; the same digest as compose.dev.yml, asserted by
    # template/test/image-pins.test.ts. Record and upgrade steps: VERSIONS.md.
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    command: ["postgres", "-c", "timezone=UTC"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      ORBIT_DB_PASSWORD: ${ORBIT_DB_PASSWORD:?}
      # The owner role, added 2026-11-17 by the FD-38 addendum. `orbit_owner` owns the orbit
      # database and runs the migrations; `orbit_app` is the runtime and owns nothing. They
      # must be different roles, or the trigger that closed FD-12 admits every request --
      # proven in docs/superpowers/spikes/2026-11-17-ownership-topology.mjs.
      ORBIT_OWNER_PASSWORD: ${ORBIT_OWNER_PASSWORD:?}
      PAPERCLIP_DB_PASSWORD: ${PAPERCLIP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Digest-pinned 2026-11-09; the same digest as compose.dev.yml. See VERSIONS.md.
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  paperclip:
    # The engine: Paperclip plus Hermes in one container (Eng v3 D3). No Gmail token, no Resend key,
    # no TOKEN_ENCRYPTION_KEY, and the paperclip database login only (SEC-2a). See engine/README.md.
    build:
      context: ./engine
      args:
        PAPERCLIP_REF: ${PAPERCLIP_REF:?}
        HERMES_REF: ${HERMES_REF:?}
    restart: unless-stopped
    read_only: true # SEC-2a; every writable path below is a volume
    environment:
      DATABASE_URL: postgresql://paperclip_app:${PAPERCLIP_DB_PASSWORD:?}@postgres:5432/paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated # DEP-5
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private # DEP-5
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?}
      BETTER_AUTH_SECRET: ${PAPERCLIP_AUTH_SECRET:?}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_SIGNING_SECRET:?}
      ANTHROPIC_API_KEY: ${ENGINE_ANTHROPIC_API_KEY:?} # its own key, not the Front Desk's (SEC-10)
    volumes:
      - paperclip_home:/paperclip # the image's own HOME and PAPERCLIP_HOME
      - hermes_data:/opt/data # HERMES_HOME: both profiles, their sessions and logs
    tmpfs: ["/tmp"] # Hermes' XDG_RUNTIME_DIR is /tmp/hermes-runtime
    ports: ["127.0.0.1:3100:3100"] # reached over the host's tailnet only (SEC-1, DEP-5)
    networks: [data, egress] # data to reach Postgres and the Front Desk; egress for model calls
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30 # first boot runs 278 migrations

  # ONE-SHOT. Applies the ORBIT migrations and exits; `api`, `worker` and `frontdesk` wait on
  # it with `service_completed_successfully`, so an instance cannot come up against an
  # unmigrated database. Before this, `docs/runbooks/slice-1-local.md` had the operator run
  # `pnpm db:migrate` by hand and nothing in the deploy did it — a deploy that skipped the step
  # brought up an api that connected and then failed every read with
  #   could not read the database (PrismaClientKnownRequestError)
  # on every healthcheck, forever. TODOS.md option 2, and the reason the other two were not
  # taken: a preflight is still a step a human can skip, and three programs racing to apply the
  # same migrations is worse than the problem.
  #
  # It deliberately does NOT use the *program anchor: that carries `restart: unless-stopped`,
  # which would restart this container after every successful exit, and a `/healthz` healthcheck
  # on a container that serves nothing.
  #
  # `prisma migrate deploy` is the non-interactive, additive-only command — it applies pending
  # migrations and never generates or resets. Re-running it is a no-op, which is what makes it
  # safe on every `up`.
  #
  # The `dbgen` stage is the image because it is the only one with the prisma CLI: the runtime
  # install is `--prod` and `prisma` is a devDependency. It runs as `orbit_app`, which OWNS the
  # `orbit` database (`template/postgres/init`), so it needs no grant it would not have in
  # production — and no new secret appears here.
  #
  # MEASURED on Compose v5.6.1, and one of the three things measured was read wrong the first
  # time. What is true:
  #
  #   * `depends_on: { condition: service_completed_successfully }` DOES wait for exit 0, and a
  #     one-shot that exits non-zero fails the whole `up` with
  #       service "migrate" didn't complete successfully: exit N
  #     That is this service's gate, and it is sound.
  #   * A later `up` of a dependent is still satisfied by the already-completed container.
  #   * **`up --wait` is NOT a way to wait for this service.** With no healthcheck, Compose
  #     treats a RUNNING container as ready: `up -d --wait migrate` returned 0 after 3s on an
  #     8s command and printed `Healthy` half a second after `Started`. Anything that then
  #     reads `ps -a --format '{{.ExitCode}}'` gets `0` from a container still running. To wait
  #     for this service on its own, use `docker compose wait migrate`, which blocks until it
  #     exits and returns its exit code.
  #
  # `pnpm stack:up` is unaffected: it brings up everything, and the programs cannot start until
  # this container has completed, whatever `--wait` reports about this one.
  migrate:
    build: { context: .., target: dbgen }
    restart: "no"
    environment:
      # RUNS AS orbit_owner, NOT orbit_app, since 2026-11-17. The comment above about "no new
      # secret" described the old arrangement and was true of it: migrate reused the runtime's
      # credential. The FD-38 addendum trades that property away deliberately, because the
      # runtime owning what it queries reopens FD-12 -- a plain UPDATE promoted a row to admin
      # with the guard never firing, measured. Objects created here are therefore owned by
      # orbit_owner, and orbit_app reaches their ROWS through the default privileges granted
      # in postgres/init/01-databases.sh.
      DATABASE_URL: postgresql://orbit_owner:${ORBIT_OWNER_PASSWORD:?}@postgres:5432/orbit
    command: ["pnpm", "--filter", "@orbit/db", "exec", "prisma", "migrate", "deploy"]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *program
    build: { context: .., args: { APP: web } }
    environment:
      PORT: "8080"
    ports: ["127.0.0.1:8080:8080"]
    networks: [edge]

  api:
    <<: *program
    build: { context: .., args: { APP: api } }
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://orbit_app:${ORBIT_DB_PASSWORD:?}@postgres:5432/orbit
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      # Slice 1: the confirm route sends the reply, so the api holds the Gmail credentials (SEC-2 deviation, see the runbook).
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:?}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:?}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?}
      APPROVAL_LINK_SECRET: ${APPROVAL_LINK_SECRET:?} # HMAC key for confirm links; at least 32 characters
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?} # the tunnel hostname; links already sent break if it changes
      MAIL_FROM: ${MAIL_FROM:?}
      TRUST_CF_CONNECTING_IP: "true" # the api is reached only through the Cloudflare tunnel, which sets this header
    ports: ["127.0.0.1:8081:8080"]
    networks: [data, edge, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *program
    build: { context: .., args: { APP: worker } }
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://orbit_app:${ORBIT_DB_PASSWORD:?}@postgres:5432/orbit
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:?}
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  frontdesk:
    <<: *program
    build: { context: .., args: { APP: frontdesk } }
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://orbit_app:${ORBIT_DB_PASSWORD:?}@postgres:5432/orbit
      REDIS_URL: redis://redis:6379
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:?}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:?}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      PAPERCLIP_API_URL: http://paperclip:3100 # the service key is created per instance (E3-T7)
      # Slice 1: the Front Desk runs the job loop, so it mails the notice and holds the Resend key (SEC-2a deviation).
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      APPROVAL_LINK_SECRET: ${APPROVAL_LINK_SECRET:?} # HMAC key for confirm links; at least 32 characters
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?} # the tunnel hostname; links already sent break if it changes
      SETUP_DIR: /setup
      MAIL_FROM: ${MAIL_FROM:?}
    # PAPERCLIP_API_KEY, PAPERCLIP_COMPANY_ID and the two agent ids are per instance and not in this template:
    # they come from .env.frontdesk, which the program checks at start.
    env_file:
      - path: ./.env.frontdesk
        required: false
    volumes:
      - ${SETUP_HOST_DIR:?}:/setup:ro # tone-samples.md and facts.md
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

networks:
  data:
    internal: true # no internet route; Postgres and Redis live only here (SEC-1)
  edge: {}         # web and api, reached by the host's reverse proxy via 127.0.0.1
  egress: {}       # outbound internet for Gmail, Resend and model calls

volumes:
  pgdata: {}
  paperclip_home: {} # Paperclip data and its own hourly backups; DEC-2 wipes it with `down -v`
  hermes_data: {} # HERMES_HOME: profiles, sessions, logs (DAT-3 purge target, E3-T5)
