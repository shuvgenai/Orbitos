name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orbit_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Section 8's dependency row. Right after install, because an advisory
      # does not depend on anything being built, and it costs a couple of
      # seconds.
      #
      # Three high advisories are ignored by GHSA id in the auditConfig block of
      # package.json, each with a reason and a review date in
      # docs/decisions.md. By id and never by severity: lowering the level to
      # critical would hide the next high advisory in a package this code
      # actually loads, which is the whole point of the row.
      #
      # No --ignore-registry-errors. A registry that cannot be reached fails
      # this step, which is noisy and correct: the alternative is a step that
      # reports clean because it asked nobody.
      - name: Dependency advisories, with three ignored by id
        run: pnpm audit --audit-level=high
      - run: pnpm db:up
      - run: pnpm db:generate
      - run: pnpm typecheck
      # Before the suite, because lint is the cheapest failure in this job and
      # should not wait behind a database and 380 tests. The seven frozen
      # directories are ignored here; their findings are the two steps below.
      - run: pnpm lint
      - run: pnpm check:screens
      # Runs all three vitest projects. That is where four section 8 rows are
      # already covered and need no step of their own: the unit suite, the
      # database suite, the axe-per-screen half in
      # dashboards/src/shared/layout/screens.axe.test.tsx, and the exact-version
      # rule in guards/version-pinning.test.ts.
      - run: pnpm test
      # A report, not a gate. The frozen directories are ignored by `pnpm lint`
      # because their findings are reported and never fixed, so this step
      # prints the per-directory counts into the job log and always exits 0.
      # It exists so the counts in docs/decisions.md cannot go stale without
      # anyone seeing it.
      - name: Lint findings in the frozen directories, reported not fixed
        run: pnpm lint:frozen
      # A gate, not a report. The freeze buys out every rule except this one:
      # dangerouslySetInnerHTML renders text from outside the office as markup,
      # and frozen code is not a safer place to do that than any other.
      - name: react/no-danger is an error in frozen code too
        run: pnpm lint:frozen:danger
      - name: Posture check, engine section (FLT-7, SEC-6)
        run: pnpm posture:check

  # Its own job, not a step in `test`. It needs a Chromium and the apt packages
  # behind it, which is a slow install, and it needs no Postgres. Keeping it
  # separate means a unit run does not pay for a browser, and the two jobs run at
  # the same time, so the wall clock falls rather than rises.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # chromium only. playwright.config.ts names Desktop Chrome for both
      # projects, so installing the other two browsers downloads around 300 MB
      # this job never opens.
      - run: pnpm exec playwright install --with-deps chromium
      # 69 cases: axe on all 66 route mounts, plus the not-found shell in each of
      # the three apps. Playwright starts both servers itself.
      - run: pnpm e2e
      # An axe failure names a rule and a node count. Without the report nobody
      # can see WHICH node, and a serious finding that cannot be located is a
      # red build somebody disables. if: failure() so a green run uploads
      # nothing.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Its own job for the same reason, and because it needs the full history that
  # the other jobs do not: a secret committed earlier and deleted later is still
  # in the pack, and a shallow clone cannot see it.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Pinned to the commit the v3.0.0 tag points at, not to the tag. A tag
      # is mutable: whoever can push to that repository can move v3.0.0 onto
      # different code, and this step runs with the repository's token. The
      # provenance of this SHA is recorded in docs/decisions.md.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for organization-owned repositories, not for personal
          # accounts. origin is github.com/shuvgenai/Orbitos, a personal
          # account, so the secret is absent and the step runs without it. The
          # line stays so that moving this repository into an organization fails
          # with a missing licence rather than silently stopping the scan.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  compose-smoke:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: smoke
      ORBIT_DB_PASSWORD: smoke
      PAPERCLIP_DB_PASSWORD: smoke
      RESEND_API_KEY: smoke
      GMAIL_CLIENT_ID: smoke
      GMAIL_CLIENT_SECRET: smoke
      TOKEN_ENCRYPTION_KEY: smoke
      ANTHROPIC_API_KEY: smoke
      # The engine service is scaled to zero below, but Compose still interpolates its variables
      # while parsing the file, so they have to be set.
      PAPERCLIP_REF: ghcr.io/paperclipai/paperclip@sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c
      HERMES_REF: nousresearch/hermes-agent@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
      PAPERCLIP_PUBLIC_URL: http://127.0.0.1:3100
      PAPERCLIP_AUTH_SECRET: smoke
      PAPERCLIP_SIGNING_SECRET: smoke
      ENGINE_ANTHROPIC_API_KEY: smoke
    steps:
      - uses: actions/checkout@v5
      # --scale paperclip=0 keeps the engine out of this job on purpose. The built engine image is
      # 8.82 GB, which does not fit a hosted runner's disk alongside the rest of the stack. Its
      # configuration is covered statically by `pnpm posture:check` in the test job, and its boot is
      # verified on the staging instance instead (PRD section 9, "a staging instance on the next
      # pinned versions"). Revisit if CI moves to a larger runner.
      - run: docker compose -f template/compose.yml up -d --build --wait --scale paperclip=0
      - name: Both databases exist and each login reaches its own (DEP-1)
        run: |
          dbs=$(docker compose -f template/compose.yml exec -T postgres psql -U postgres -tAc "select datname from pg_database where datname in ('orbit','paperclip') order by 1")
          test "$dbs" = "$(printf 'orbit\npaperclip')" || { echo "unexpected databases: $dbs"; exit 1; }
          o=$(docker compose -f template/compose.yml exec -T -e PGPASSWORD="$ORBIT_DB_PASSWORD" postgres psql -h 127.0.0.1 -U orbit_app -d orbit -tAc "select current_database()")
          test "$o" = orbit || { echo "orbit_app login failed: $o"; exit 1; }
          p=$(docker compose -f template/compose.yml exec -T -e PGPASSWORD="$PAPERCLIP_DB_PASSWORD" postgres psql -h 127.0.0.1 -U paperclip_app -d paperclip -tAc "select current_database()")
          test "$p" = paperclip || { echo "paperclip_app login failed: $p"; exit 1; }
      - run: curl -fsS http://127.0.0.1:8080/healthz && curl -fsS http://127.0.0.1:8081/healthz
      - if: always()
        run: docker compose -f template/compose.yml down -v
